title: Web & CRO
num: "05"
desc: Websites that convert — built on Webflow, fast, and built to rank.
long: >-
  Your website is your best salesperson. I design and build conversion-focused
  websites that load fast, rank well, and guide visitors toward a single goal.
  Webflow as the platform means you stay in control without needing a
  developer for every change.
headline: Your website should be generating leads — not just existing online
intro: >-
  Most SME websites describe the business but don't convert visitors into
  enquiries. They load slowly, bury the value proposition, and send everyone
  to the same contact page regardless of what they were looking for. I design
  and build websites that are conversion-focused from the first wireframe —
  built on Webflow so you stay in control without needing a developer for
  every change.
why: >-
  A website that doesn't convert is a leaky bucket. You can spend whatever you
  like on SEO and paid media, but if the site doesn't guide visitors toward a
  clear next step — with the right message, at the right moment — you're
  paying to fill a bucket with a hole in it. CRO fixes the hole before you
  pour more traffic in.
process:
  - num: "01"
    title: Audit and strategy
    body: >-
      I start with a conversion audit of your existing site: where visitors
      are dropping off, which pages have the highest exit rates, and what's
      stopping people from making contact. This shapes the build brief. We
      also confirm the technical SEO requirements — page architecture, URL
      structure, site speed targets — so the new site doesn't sacrifice search
      visibility for design.
  - num: "02"
    title: Design and build
    body: >-
      Built on Webflow, with technical SEO embedded from the start: semantic
      HTML, Core Web Vitals optimisation, structured data, and clean canonical
      structure. Every page is built around a single conversion goal. Landing
      pages for paid campaigns get their own variants, tested against each
      other to improve conversion rate over time.
  - num: "03"
    title: Connect and hand over
    body: >-
      Integration with your existing tools: Google Analytics, Search Console,
      CRM, email platform, live chat. I train you on the Webflow CMS so you
      can update content without touching code. Post-launch, I monitor Core
      Web Vitals and conversion rates and flag anything that needs attention.
deliverables:
  - Conversion audit of existing site
  - UX and information architecture recommendations
  - Webflow design and build
  - Technical SEO embedded from build
  - CMS setup and team training
  - Core Web Vitals optimisation
  - Martech integration (GA4, CRM, email)
