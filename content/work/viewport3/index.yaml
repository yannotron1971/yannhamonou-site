client: Viewport3
order: 2
year: "2026"
descriptor: Positioning & SEO
stat: +38%
statSub: demo request uplift
summary: >-
  Reframed Viewport3 from photogrammetry vendor to dimensional assurance
  partner, out of price competition and into a category of their own.
image: /work/clamp.avif
imageAlt: "A subsea structural clamp fitted to a jacket member, rendered in murky water."
imageFocus: center
logo: viewport3
challenge: >-
  Viewport3 does subsea photogrammetry: ROV and diver-mounted cameras
  producing sub-millimetric 3D scans of underwater assets. Buyers were
  comparing them against generic 3D scanning vendors on price, because the
  category they were being shopped in did not describe what they actually
  deliver. The sales cycle ran long while prospects worked out the difference
  for themselves.
approach:
  - >-
    Positioning sprint — customer interviews first, to find what their best
    clients actually valued and the words they used for it
  - >-
    Category design — reframed from "photogrammetry vendor" to "dimensional
    assurance partner", with seven provable differentiators behind it
  - >-
    Messaging framework — claims, proof points and objection handling, drawn
    from how those customers described the service
  - >-
    Website messaging refresh — rewrote key landing pages to lead with the
    repositioned narrative
  - >-
    Demand generation strategy — defined the content and outreach channels
    most likely to reach their ideal buyer profile
results:
  - +38% increase in qualified demo requests within 90 days
  - Shortened average sales cycle from discovery to proposal stage
  - >-
    Consistent positioning language adopted across sales, marketing, and
    leadership
  - Clear differentiation from generic competitors in prospect conversations
