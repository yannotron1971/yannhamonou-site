title: Marketing Strategy
num: "02"
desc: Clear, practical strategy rooted in your business goals — not templates.
long: >-
  Most SMEs jump straight to tactics. Strategy first means every pound you
  spend is pointed at the right target. I audit your current position, map
  your competitive landscape, and build a 12-month roadmap that your team can
  actually execute.
headline: Stop wasting budget on tactics without a strategy behind them
intro: >-
  In today's competitive landscape, SMEs need more than tactical marketing —
  they need a clear, actionable strategy that connects every activity to
  revenue. Drawing from 20+ years of B2B experience across Scotland and the
  UK, I build practical marketing strategies that drive growth without
  overwhelming your resources.
why: >-
  Most marketing problems aren't channel problems. They're strategy problems:
  unclear positioning, the wrong audience, no measurement framework. Fix the
  upstream problem first and execution becomes straightforward.
process:
  - num: "01"
    title: Marketing audit
    body: >-
      I review everything you're currently doing — what's delivering results
      and what isn't. This includes competitor analysis and understanding how
      customers currently find and interact with your business. The audit
      reveals immediate opportunities and shapes what comes next.
  - num: "02"
    title: Strategy development
    body: >-
      I build a strategy that fits your business goals and resources. We
      identify exactly who your ideal customers are and how to reach them. You
      get a practical, month-by-month plan that focuses budget on the channels
      most likely to produce results — with proper tracking so you can see
      what's working.
  - num: "03"
    title: Ongoing support
    body: >-
      Marketing needs regular attention and adjustment. Through monthly
      check-ins, I review performance in plain English — no jargon. Expert
      direction without the cost of a full-time marketing manager.
deliverables:
  - Current-state marketing audit
  - Competitor landscape map
  - 12-month priority roadmap
  - Channel mix recommendations with budget allocation
  - KPI framework and monthly targets
  - Tracking and measurement setup
caseNote: ""
proof:
  quote: >-
    Yann transformed our martech stack and used data insights to develop
    highly effective marketing campaigns. His efforts resulted in increased
    brand visibility and a 100% increase in lead generation performance over a
    period of just 12 months.
  name: Debbie Mackenzie
  role: Managing Director
  company: Proactis Tenders
  logo: proactis
faq:
  - q: Why work with a consultant rather than hire in-house?
    a: >-
      You get senior-level marketing expertise and execution capability at a
      fraction of the cost of a full-time hire. You also benefit from
      experience across multiple industries and proven frameworks — without
      the overhead of employment costs, management time, or the risk of a bad
      hire.
  - q: What makes your approach different?
    a: >-
      I combine strategic thinking with practical execution. Unlike pure
      consultants who deliver a document and leave, I help implement the
      strategies we build together — which means I'm accountable for results,
      not just recommendations.
  - q: How do you measure success?
    a: >-
      Every engagement starts with clear, measurable objectives. Whether it's
      lead generation, market positioning, or digital presence, we track
      concrete metrics aligned with your business goals. No vanity metrics.
  - q: What are your fees?
    a: >-
      Engagements are scoped to the work rather than sold as packages, so the
      honest answer is that it depends on what you need and how much of it you
      want done for you. The free 30-minute review is the right starting
      point: you will have a figure before you commit to anything.
