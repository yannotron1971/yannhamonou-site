faq:
  - q: Do you work with companies outside Aberdeen?
    a: >-
      Yes — I work remotely with clients across Scotland and the rest of the UK.
      Most of my work is delivered online, so location isn't a barrier.
  - q: What size of company do you typically work with?
    a: >-
      B2B SMEs with 5–100 employees, typically with an existing sales team but a
      marketing function that's under-resourced or under-performing.
  - q: How does the free 30-minute strategy review work?
    a: >-
      We talk through your current situation, your biggest growth challenge, and
      where you're losing opportunities. I'll share what I'd prioritise. No
      pitch, no agenda — just a useful conversation.
  - q: Do you offer retainers or project-based work?
    a: >-
      Both. I offer monthly retainers for ongoing strategy and execution, and
      fixed-scope projects for specific deliverables like a positioning sprint or
      SEO audit.
