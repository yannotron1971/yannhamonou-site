faq:
  - q: Why Webflow and not WordPress?
    a: >-
      Webflow gives you a visual CMS that's fast to build, easy for
      non-developers to update, and produces clean, performant code without a
      plugin ecosystem to maintain. It's also significantly faster than a
      typical WordPress install out of the box. For clients who have a
      specific reason to stay on WordPress, I can work with that too.
  - q: Do you do design or just development?
    a: >-
      Both. I handle the full process from information architecture through
      visual design to the live Webflow build. If you have an existing brand
      identity I'll work within it; if not, I'll develop the visual direction
      as part of the project.
  - q: Can you improve our existing site without rebuilding it?
    a: >-
      Often yes. A CRO audit can identify the highest-impact changes —
      sometimes a headline rewrite and a clearer CTA on the homepage moves the
      needle more than a full rebuild. I'll tell you honestly whether an
      audit-and-optimise or a rebuild is the right answer for your situation.
  - q: What does a website project cost?
    a: >-
      It depends on the number of pages, whether the CMS needs to be editable
      by your team, and how much of the content exists already. A four-page
      marketing site and a fifty-page site with landing-page variants are
      different projects. I scope it after the free 30-minute review.
