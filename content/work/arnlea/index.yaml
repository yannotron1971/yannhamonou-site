summary: >-
  Rebuilt Arnlea's website from the ground up in Webflow, SEO first, then
  added the content that took them from 96 to 275 first-page Google rankings
  in six months. Google's AI answer now names Nexar first for Ex inspection
  software.
image: /work/Arnlea-H.avif
imageAlt: "Offshore worker in hi-vis holding a rugged handheld running the Nexar inspection app, shoreline behind."
imageFocus: center
logo: arnlea
challenge: >-
  Arnlea Systems, in Aberdeen, makes Nexar: software for Ex and ATEX
  inspection in hazardous areas. The old website could not carry that. It
  gave buyers no clear route from first question to demo request, and gave
  search engines no structure to read a specialist product from. Patching it
  would have kept both problems, so the whole site had to be rebuilt.
approach:
  - >-
    Full rebuild in Webflow, SEO first — site structure and navigation planned
    for search engines as much as for buyers, before any design
  - >-
    Dedicated pages for each stage of the buyer's journey: awareness,
    consideration and conversion
  - >-
    Technical and on-page SEO built in from launch, with every old URL
    redirected to its new home so no ranking was lost in the move
  - >-
    Measurement and lead capture wired in: Google Analytics, Tag Manager,
    Microsoft Clarity, LinkedIn Insight and ActiveCampaign demo forms
  - >-
    Then the content: three ATEX inspection guides, and a rewrite of the
    Nexar page for the AI assistants buyers now ask first
results:
  - >-
    First-page Google rankings, excluding the brand name, up from 96 to 275
    (Feb–Jul 2026 against the six months before)
  - Top-three rankings up from 33 to 146
  - Times shown in Google up 216%, visits from search up 30%
  - >-
    Google's AI answer for Ex inspection software names "Nexar by Arnlea"
    first, and ChatGPT lists Arnlea first
