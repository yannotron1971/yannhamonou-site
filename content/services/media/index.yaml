title: Organic & Paid Media
num: "04"
desc: One plan across the channels you own and the ones you buy.
long: >-
  Organic and paid pull in the same direction when the same person runs them.
  I build the audience through organic social, email and content distribution,
  and buy reach where buying it is worth the money: Google for active demand,
  LinkedIn for the accounts you want, Meta for people who already visited.
headline: Reach your buyers where they already are, earned and bought
intro: >-
  Advertising can put qualified leads in front of you within a week, but only
  if someone manages it properly. I have run B2B campaigns across Google,
  Microsoft and LinkedIn on budgets up to £200,000 a year, and the same thing
  holds every time: paid buys attention now, organic compounds it. Run apart,
  the two duplicate each other and argue over the credit. Run together, the
  audience you build organically is the one you retarget, and the post that
  earned attention on its own is the one worth paying to amplify.
why: >-
  Most B2B paid media is optimised for clicks rather than pipeline. The
  audience is drawn too wide, the traffic lands on a page that was written for
  nobody in particular, and nothing connects lead quality back to the bidding.
  Most B2B organic has a different problem: a company page posting product
  updates to an audience of its own staff and its competitors. One fix covers
  both. Decide who you are talking to, say something they would repeat to a
  colleague, and measure what pays your invoices rather than what the platform
  likes to report.
process:
  - num: "01"
    title: Plan both sides together
    body: >-
      I audit what you are already running: spend, audiences, creative, and
      the organic accounts nobody has posted to since the last campaign. Then
      we decide which job each channel does. Google Search captures demand
      that already exists. LinkedIn reaches the job titles and accounts you
      want before they start looking. Organic social and email build the
      audience that makes the paid cheaper, because retargeting people who
      already know you costs a fraction of finding strangers.
  - num: "02"
    title: Build and launch
    body: >-
      I handle campaign structure, ad copy, landing page direction, conversion
      tracking and attribution, alongside a posting cadence you can sustain
      after I leave. Attribution matters more in B2B than anywhere: a lead
      that came from LinkedIn last week and converted through Google today has
      to be recorded properly, or you switch off the channel that started the
      relationship.
  - num: "03"
    title: Optimise and report
    body: >-
      Each week I go through audience segments, ad variations, match types and
      bids, and through what the organic posts actually did. Anything that
      earns attention without spend gets amplified with it. Once a month you
      get plain English: what we spent, what it produced, what changes next.
      The loop that makes any of this improve runs from your sales team back
      to the campaign settings.
deliverables:
  - Channel plan covering organic and paid together
  - Audience targeting, segmentation and retargeting pools
  - Ad copy, creative direction and organic posting cadence
  - Conversion tracking and attribution setup
  - Landing page CRO recommendations
  - Weekly optimisation and monthly reporting
