title: Positioning
num: "01"
desc: Stand out in your market with a message that resonates and converts.
long: >-
  Positioning is the highest-leverage work in marketing. Get it right and
  everything downstream — copy, ads, sales conversations — becomes easier. I
  run a structured positioning sprint that defines your category, ideal buyer,
  and differentiators.
headline: >-
  Define what makes your business different — before you spend on marketing
  that doesn't work
intro: >-
  Marketing positioning is the process of defining how your business is
  perceived by the people you want to buy from you. It answers three
  questions: who is this for, why should they choose you over the
  alternatives, and how do you communicate that clearly? Some companies skip
  this step. They build websites, run campaigns, and invest in SEO without
  first working out what they're saying — and to whom.
why: >-
  When positioning is missing, your website describes what you do but not why
  it matters. Leads come in from the wrong sectors. You compete on price
  because buyers can't see a meaningful difference. Sales cycles drag because
  buying committees can't justify the choice internally. These are all
  positioning problems — not execution problems.
process:
  - num: "01"
    title: Understand
    body: >-
      I start with your best customers: why they bought, what they were using
      before, and how they'd describe you to a colleague. I map the
      competitive alternatives your buyers actually evaluate — not always who
      you'd expect. Sometimes the real competitor is "do nothing" or "hire
      internally". This research surfaces what your business does well in the
      language real buyers use.
  - num: "02"
    title: Define
    body: >-
      From the research, I isolate the attributes that are genuinely yours —
      not claims your competitors could equally make. I connect each to a
      concrete benefit the buyer cares about and choose the market frame where
      your strengths are most visible. The same service positioned differently
      competes in a completely different landscape.
  - num: "03"
    title: Articulate
    body: >-
      The output is a positioning statement and messaging framework your team
      can actually use — specific claims, proof points, and buyer language for
      your website, proposals, sales calls, and content. Positioning is a
      decision, not a tattoo. It's designed to be revisited as your market
      evolves.
deliverables:
  - Competitive alternatives map
  - Differentiating attributes with proof points
  - Positioning statement
  - Messaging framework (claims, proof, buyer language)
  - Target customer profiles
  - Implementation recommendations for website and content
caseNote: >-
  Viewport3 was being compared to generic 3D scanning vendors, even though
  their subsea photogrammetry work is fundamentally different. Through a
  structured positioning sprint, we reframed them from "photogrammetry vendor"
  to "dimensional assurance partner" — identified seven provable
  differentiators and built a messaging framework drawn from how their best
  customers describe the service. The category shift moved them out of price
  competition entirely.
proof:
  quote: >-
    Yann doesn't do fluff. He came in, understood our business quickly, and
    delivered a positioning and SEO strategy that's already showing results.
    I'd recommend him to any SME serious about growth.
