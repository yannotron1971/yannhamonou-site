title: Marketing Leadership
num: "06"
desc: Someone senior running your marketing, a day or two a week.
long: >-
  Your marketing needs someone senior deciding what it does and answering for
  what it produces. I take that seat one or two days a week: setting the
  direction, running the plan, managing whoever executes it, and reporting to
  you or your board in plain English.
headline: Senior marketing direction, without a senior hire
intro: >-
  Plenty of SMEs have marketing activity and no marketing leadership. A junior
  marketer doing their best with no brief, or an agency that reports
  impressions and invoices monthly. The work happens, but nobody owns the
  question of whether it is the right work. That is the seat I take, one or
  two days a week instead of a salary.
why: >-
  A marketing director in Aberdeen costs £60,000 to £80,000 before employer
  costs, so most SMEs leave the role unfilled and the decisions fall to
  whoever is nearest. Budget follows whatever is easiest to measure. You brief
  an agency in a sentence, then judge it on whether the invoice felt worth
  paying. Campaigns start when someone has a free week. Every one of those is
  a decision nobody was appointed to make, and at this size making them is not
  a full-time job.
process:
  - num: "01"
    title: Take stock
    body: >-
      I start where a new marketing director would: what you have spent, what
      it produced, who does what, and which contracts you are already
      committed to. That means the numbers, including pipeline, sources and
      cost per lead where anyone has tracked it, and the people, including any
      agency or freelancer already on the books. You get an honest read on
      what works, what does not, and what nobody owns.
  - num: "02"
    title: Set the direction and own it
    body: >-
      You get a plan with priorities, a budget mapped to them, and one number
      per activity that decides whether it continues. Then I run it: briefing
      whoever executes, holding agencies to the numbers they signed up to, and
      making the trade-offs when they arrive instead of parking them until the
      next quarter. You stay in the decisions that change the business and out
      of the weekly ones.
  - num: "03"
    title: Report, adjust, and hand over
    body: >-
      Each month, a review you could take to a board or a bank: what we spent,
      what it produced, what changes next and why. The role should shrink as
      the function matures. Part of the job is telling you when you are ready
      to hire in-house, and writing the brief for that hire.
deliverables:
  - Fractional marketing director, one or two days a week
  - Marketing plan, budget allocation and quarterly priorities
  - Agency and freelancer selection, briefing and management
  - Reporting pack for you, your board or your investors
  - Team mentoring for an in-house marketer
  - Recruitment support when the role becomes full-time
