faq:
  - q: Is positioning the same as branding?
    a: >-
      No. Branding covers visual identity — logo, colour, tone. Positioning is
      the strategic decision about how you compete: who you're for, what you
      do better than alternatives, and why that matters to the buyer. Good
      positioning makes branding more effective. Branding without positioning
      is decoration.
  - q: Can't we figure out positioning ourselves?
    a: >-
      Sometimes. But most founders and leadership teams are too close to their
      business to see it the way buyers do. The positioning process starts
      with customer interviews, not internal workshops, precisely because the
      most important insights come from outside the building.
  - q: How long does a positioning engagement take?
    a: >-
      Typically 3–5 weeks for a focused sprint: customer interviews,
      competitive mapping, positioning development, and messaging framework.
      Ongoing refinement as you test messaging in the market is part of the
      engagement.
  - q: Do I need positioning before I work on SEO or paid media?
    a: >-
      Not strictly, but it makes everything downstream more effective. If you
      don't know exactly who you're targeting and what makes you different,
      your SEO content will be generic and your ad copy won't convert.
      Positioning is the brief that all execution works from.
