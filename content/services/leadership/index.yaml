faq:
  - q: How is this different from the strategy service?
    a: >-
      Strategy is a project with an end: research, decisions, a plan you own.
      Leadership is the seat that runs the plan month after month and changes
      it when the evidence says so. Engagements often start as strategy and
      become leadership, because a plan with nobody running it goes back in a
      drawer.
  - q: How much of your week do we get?
    a: >-
      One or two days, split across the week rather than taken in a block, so
      decisions do not wait five days and I am not managing agencies in
      arrears. The first month usually runs heavier while I get across your
      numbers and your people.
  - q: Do you replace our agency or our marketer?
    a: >-
      Neither, most of the time. The execution is usually fine and the
      direction is missing, so I manage what you already have. If an agency is
      not delivering I will show you the numbers and help you replace them,
      but that is a finding rather than the starting assumption.
  - q: What happens when we are ready to hire in-house?
    a: >-
      That is the intended ending. I write the role, sit in on interviews, and
      hand over a function with a plan, a budget and reporting already in
      place. Whoever takes it on gets a far easier first six months than
      someone inheriting a blank page.
