challenge: >-
  Arnlea Systems, a specialist supplier of safety-critical industrial
  equipment, had almost no organic search presence despite 30+ years of
  trading. They were losing leads to newer competitors who had invested in
  digital and needed to establish authority in a competitive technical niche.
approach:
  - >-
    Technical SEO audit — fixed crawl errors, consolidated duplicate pages,
    improved site speed to pass Core Web Vitals
  - >-
    Keyword and intent mapping — identified 40+ target terms across product
    categories and buyer intent stages
  - >-
    Content strategy — created authoritative product pages, technical guides,
    and local landing pages for Aberdeen and North Sea market
  - >-
    Local SEO — fully optimised Google Business Profile, Bing Places, and
    built consistent NAP citations
  - >-
    GEO setup — structured data and FAQ schema to capture AI-powered search
    visibility
results:
  - "#3 Google ranking for primary commercial terms within 4 weeks of launch"
  - 500% increase in organic traffic within 6 months
  - 100+ qualified organic visits per month, up from near-zero
  - First-page visibility for 25+ target keywords
