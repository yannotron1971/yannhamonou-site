faq:
  - q: How does this differ from SEO & GEO?
    a: >-
      SEO and GEO win you visibility in search and in AI answers, where
      someone is already looking for what you sell. This service covers
      everything else that reaches them: paid campaigns on Google, LinkedIn
      and Meta, and the organic social, email and content distribution that
      build an audience between purchases. Most engagements run both, because
      search captures demand and media creates it.
  - q: Which platform should I advertise on?
    a: >-
      It depends where your buyers are and what stage they are at. Google
      Search captures active demand from people already looking for what you
      sell. LinkedIn reaches specific job titles and company types before they
      start searching. Meta works for retargeting visitors who did not
      convert. Most B2B businesses benefit from Google first, LinkedIn second,
      Meta third.
  - q: What budget do I need to get started?
    a: >-
      A focused local or niche Google Search campaign can produce results on
      £1,000 to £2,000 a month in ad spend. LinkedIn costs more per click and
      reaches decision-makers more precisely, so £2,000 a month is a sensible
      floor. Below those levels there is too little data to optimise on, and
      you are paying to guess.
  - q: Is organic worth it if we are already advertising?
    a: >-
      It is what makes the advertising cheaper. Retargeting an audience that
      already recognises you converts at a fraction of the cost of cold reach,
      and the organic posts tell you which messages are worth putting budget
      behind before you spend anything finding out.
  - q: How long before I see results?
    a: >-
      Google Search campaigns can generate leads in the first week. LinkedIn
      usually takes four to six weeks to settle on the right audience and
      creative. Organic works on a longer clock again: three months of
      consistent posting before the audience is worth retargeting. Expect
      three months before you have enough data to make confident decisions
      across the lot.
  - q: Can you manage campaigns we have already started?
    a: >-
      Yes, and most clients arrive that way — spending, but not converting. I
      start with a full account audit, find what is wasting budget, and
      restructure before adding a penny of spend.
